name: Protocol contracts

# P1a: relay/contracts.py, docs/remote-control/protocol/* schemas, fixtures and
# registries must agree (tests/test_protocol_fixtures.py), and the existing unit
# tests must still pass. Read-only, no secrets, never publishes.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUIRE_JSONSCHEMA: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned test dependencies
        run: python -m pip install --require-hashes "--only-binary=:all:" -r requirements-dev.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v
