name: Build macOS DMG

on:
  push:
    branches: [main, master]
  # User decision 2026-11-20: PRs into the default branch upload a debug test
  # artifact (Actions artifact only, never a release, no secrets).
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # builds and verifies only; never publishes (§7.2)

# Default-deny publication gate (ARCHITECTURE.md §7.2, release/README-publication.md).
# There is no public DMG. The only allowed mutation is a restricted internal
# upload, and no verified private destination exists yet, so nothing uploads.
permissions:
  contents: read

jobs:
  build-dmg:
    runs-on: macos-latest
    env:
      DMG: CU-Denver-Equity-Kiosk-Manager.dmg
      # Declared by the source tree; the classifier fails if it disagrees with
      # release/remote-inventory.txt. relay/ exists since P1a, so the tree is remote-capable.
      REMOTE_FEATURES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download Android Platform Tools (macOS)
        run: |
          curl -L -o /tmp/platform-tools.zip \
            "https://dl.google.com/android/repository/platform-tools-latest-darwin.zip"
          unzip -o /tmp/platform-tools.zip -d .

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK from source (Gradle)
        env:
          # Same-repo PRs would otherwise receive secrets; PR builds stay debug.
          KIOSK_KEYSTORE_B64: ${{ github.event_name != 'pull_request' && secrets.KIOSK_KEYSTORE_B64 || '' }}
          KIOSK_KEYSTORE_PASS: ${{ github.event_name != 'pull_request' && secrets.KIOSK_KEYSTORE_PASS || '' }}
          KIOSK_KEYSTORE_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KIOSK_KEYSTORE_ALIAS || '' }}
          KIOSK_CERT_SHA256: ${{ vars.KIOSK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -n "$KIOSK_KEYSTORE_B64" ]; then
            export KIOSK_KEYSTORE="$RUNNER_TEMP/kiosk-release.keystore"
            trap 'rm -f "$KIOSK_KEYSTORE"' EXIT
            umask 077
            printf '%s' "$KIOSK_KEYSTORE_B64" | base64 --decode > "$KIOSK_KEYSTORE"
          else
            unset KIOSK_KEYSTORE_PASS KIOSK_KEYSTORE_ALIAS
          fi
          unset KIOSK_KEYSTORE_B64
          bash build-apk-mac.sh
          mkdir -p dist/build
          cp build/CU-Denver-Equity-Kiosk.apk build/apk-info.txt dist/build/

      - name: Install pinned PyInstaller
        # The same pinned version builds the app and reads it back in the classifier.
        run: python3 -m pip install "pyinstaller==6.22.3"

      - name: Build macOS .app
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name "CU-Denver-Equity-Kiosk-Manager" \
            --add-data "platform-tools:platform-tools" \
            --osx-bundle-identifier "edu.ucdenver.equity-kiosk-manager" \
            kiosk-manager.py

      - name: Create DMG
        run: |
          DMG_DIR="/tmp/kiosk-dmg"
          rm -rf "$DMG_DIR"
          mkdir -p "$DMG_DIR"

          cp -R "dist/CU-Denver-Equity-Kiosk-Manager.app" "$DMG_DIR/"
          mkdir -p "$DMG_DIR/Kiosk-APK"
          cp dist/build/CU-Denver-Equity-Kiosk.apk dist/build/apk-info.txt "$DMG_DIR/Kiosk-APK/"

          hdiutil create \
            -volname "CU Denver Equity Kiosk Manager" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "$DMG"

      - name: Verify and classify final DMG
        id: classify
        env:
          KIOSK_CERT_SHA256: ${{ vars.KIOSK_CERT_SHA256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PRIVATE_ARTIFACT_DESTINATION: ${{ vars.PRIVATE_ARTIFACT_DESTINATION }}
        run: |
          set -euo pipefail
          mnt="$RUNNER_TEMP/dmg-verify"
          mkdir -p "$mnt"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$DMG"
          trap 'hdiutil detach "$mnt" -force || true' EXIT
          python3 scripts/classify_candidate.py --platform macos \
            --dmg "$DMG" --dmg-mount "$mnt" \
            --record build/candidate-record.txt
          cat build/candidate-record.txt

      # Push builds: macOS only allows a restricted internal upload, which needs a
      # verified PRIVATE_ARTIFACT_DESTINATION (none exists, so nothing uploads).
      # PR builds: the debug test artifact below is the only mutation.

      - name: Recheck PR artifact digest and write warning
        id: prdigest
        if: >-
          steps.classify.outputs.allow_pr_artifact == 'true' &&
          github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^dmg_sha256=//p' build/candidate-record.txt)
          actual=$(shasum -a 256 "$DMG" | cut -d' ' -f1)
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::final DMG digest changed after classification"
            exit 1
          fi
          cat > build/DEBUG-BUILD-WARNING.txt <<'EOF'
          Debug APK, not a fleet release. Each CI run may use a different signing key,
          so updates to existing installations can fail. Do not uninstall or reset to
          force an update. Inventory the installed signer and follow supervised recovery.
          EOF
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Upload PR test artifact
        if: >-
          steps.classify.outputs.allow_pr_artifact == 'true' &&
          steps.prdigest.outputs.ok == 'true' &&
          github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.pull_request.number }}-macos-debug
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ env.DMG }}
            build/apk-info.txt
            build/candidate-record.txt
            build/DEBUG-BUILD-WARNING.txt
