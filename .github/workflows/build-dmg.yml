name: Build macOS DMG

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  build-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download Android Platform Tools (macOS)
        run: |
          curl -L -o /tmp/platform-tools.zip \
            "https://dl.google.com/android/repository/platform-tools-latest-darwin.zip"
          unzip -o /tmp/platform-tools.zip -d .

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK from source (Gradle)
        env:
          KIOSK_KEYSTORE_B64: ${{ secrets.KIOSK_KEYSTORE_B64 }}
          KIOSK_KEYSTORE_PASS: ${{ secrets.KIOSK_KEYSTORE_PASS }}
          KIOSK_KEYSTORE_ALIAS: ${{ secrets.KIOSK_KEYSTORE_ALIAS }}
          KIOSK_CERT_SHA256: ${{ vars.KIOSK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -n "$KIOSK_KEYSTORE_B64" ]; then
            export KIOSK_KEYSTORE="$RUNNER_TEMP/kiosk-release.keystore"
            trap 'rm -f "$KIOSK_KEYSTORE"' EXIT
            umask 077
            printf '%s' "$KIOSK_KEYSTORE_B64" | base64 --decode > "$KIOSK_KEYSTORE"
          else
            unset KIOSK_KEYSTORE_PASS KIOSK_KEYSTORE_ALIAS
          fi
          unset KIOSK_KEYSTORE_B64
          bash build-apk-mac.sh
          mkdir -p dist/build
          cp build/CU-Denver-Equity-Kiosk.apk build/apk-info.txt dist/build/
          variant=$(sed -n 's/^variant=//p' build/apk-info.txt)
          echo "KIOSK_APK_VARIANT=$variant" >> "$GITHUB_ENV"

      - name: Install PyInstaller
        run: pip3 install pyinstaller

      - name: Build macOS .app
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name "CU-Denver-Equity-Kiosk-Manager" \
            --add-data "platform-tools:platform-tools" \
            --osx-bundle-identifier "edu.ucdenver.equity-kiosk-manager" \
            kiosk-manager.py

      - name: Create DMG
        run: |
          DMG_DIR="/tmp/kiosk-dmg"
          rm -rf "$DMG_DIR"
          mkdir -p "$DMG_DIR"

          cp -R "dist/CU-Denver-Equity-Kiosk-Manager.app" "$DMG_DIR/"
          mkdir -p "$DMG_DIR/Kiosk-APK"
          cp dist/build/CU-Denver-Equity-Kiosk.apk dist/build/apk-info.txt "$DMG_DIR/Kiosk-APK/"

          hdiutil create \
            -volname "CU Denver Equity Kiosk Manager" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "CU-Denver-Equity-Kiosk-Manager.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: macOS-DMG-${{ env.KIOSK_APK_VARIANT }}
          path: CU-Denver-Equity-Kiosk-Manager.dmg
          retention-days: 30
