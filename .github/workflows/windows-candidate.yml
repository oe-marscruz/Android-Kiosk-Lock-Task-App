name: Windows candidate

# Called only by build-exe.yml. One job builds, signs, verifies, classifies and
# (only when every gate allows it) publishes, so the final bytes never leave it.
on:
  workflow_call:
    secrets:
      KIOSK_KEYSTORE_B64:
        required: false
      KIOSK_KEYSTORE_PASS:
        required: false
      KIOSK_KEYSTORE_ALIAS:
        required: false
      WINDOWS_SIGNING_CERTIFICATE:
        required: false
      WINDOWS_SIGNING_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest
    env:
      APP_NAME: CU-Denver-Equity-Kiosk-Manager
      # Declared by the source tree; the classifier fails if it disagrees with
      # release/remote-inventory.txt. Flip to "1" in the change that adds remote code.
      REMOTE_FEATURES: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download Android Platform Tools (Windows)
        run: |
          curl -L -o platform-tools.zip "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
          Expand-Archive -Path platform-tools.zip -DestinationPath . -Force
          Remove-Item platform-tools.zip

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK from source (Gradle)
        # Release-signed only when KIOSK_KEYSTORE_B64 is configured; otherwise
        # debug-signed and labelled debug (ARCHITECTURE.md section 7.1).
        shell: bash
        env:
          KIOSK_KEYSTORE_B64: ${{ secrets.KIOSK_KEYSTORE_B64 }}
          KIOSK_KEYSTORE_PASS: ${{ secrets.KIOSK_KEYSTORE_PASS }}
          KIOSK_KEYSTORE_ALIAS: ${{ secrets.KIOSK_KEYSTORE_ALIAS }}
          KIOSK_CERT_SHA256: ${{ vars.KIOSK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -n "$KIOSK_KEYSTORE_B64" ]; then
            export KIOSK_KEYSTORE="$RUNNER_TEMP/kiosk-release.keystore"
            trap 'rm -f "$KIOSK_KEYSTORE"' EXIT
            umask 077
            printf '%s' "$KIOSK_KEYSTORE_B64" | base64 -d > "$KIOSK_KEYSTORE"
          else
            unset KIOSK_KEYSTORE_PASS KIOSK_KEYSTORE_ALIAS
          fi
          unset KIOSK_KEYSTORE_B64
          bash build-apk.sh

      - name: Install pinned PyInstaller
        # The same pinned version builds the EXE and reads it back in the classifier.
        run: python -m pip install "pyinstaller==6.22.3"

      - name: Build Windows .exe
        run: |
          pyinstaller --onefile --windowed --name "$env:APP_NAME" `
            --add-data "platform-tools;platform-tools" `
            --add-data "build/CU-Denver-Equity-Kiosk.apk;." `
            kiosk-manager.py

      - name: Sign and verify Authenticode (if configured)
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          WINDOWS_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "dist/$env:APP_NAME.exe"
          $evidence = 'build/authenticode-evidence.txt'
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE) {
            Set-Content -Path $evidence -Value 'authenticode=unsigned' -Encoding ascii
            Write-Host 'WINDOWS_SIGNING_CERTIFICATE is not configured: the EXE stays unsigned.'
            exit 0
          }
          if (-not $env:WINDOWS_TIMESTAMP_URL -or -not $env:WINDOWS_SIGNER_THUMBPRINT) {
            throw 'Signing needs both WINDOWS_TIMESTAMP_URL and WINDOWS_SIGNER_THUMBPRINT.'
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          $pfx = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_SIGNING_PASSWORD `
              /fd SHA256 /tr $env:WINDOWS_TIMESTAMP_URL /td SHA256 $exe
            # A signing failure never falls back to unsigned.
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          }
          $out = & $signtool.FullName verify /v /pa /all /tw $exe 2>&1 | Out-String
          $verifyExit = $LASTEXITCODE
          Write-Host $out
          # -cmatch: the summary line "Number of warnings: 0" must not trip the check.
          if ($verifyExit -ne 0 -or $out -cmatch 'Warning' -or $out -match 'Number of (warnings|errors): [1-9]') {
            throw 'signtool verify reported an error or warning'
          }
          $count = ([regex]::Matches($out, 'Signature Index:')).Count
          $sig = Get-AuthenticodeSignature $exe
          $pin = ($env:WINDOWS_SIGNER_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Thumbprint -ne $pin) {
            throw 'EXE signer thumbprint does not match WINDOWS_SIGNER_THUMBPRINT'
          }
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          # TODO(P1b): per-signature RFC 3161 token validation with a pinned PKCS#7
          # parser (release/README-publication.md). Until then the EXE is not
          # signed-eligible, so it is classified unsigned and never published.
          Set-Content -Path $evidence -Encoding ascii -Value @(
            'authenticode=signed', "exe_sha256=$sha", 'signtool_verify=pass',
            "signature_count=$count", 'signer_thumbprint_match=true', 'rfc3161_validated=false')

      - name: Verify and classify final candidate
        id: classify
        shell: bash
        env:
          KIOSK_CERT_SHA256: ${{ vars.KIOSK_CERT_SHA256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PRIVATE_ARTIFACT_DESTINATION: ${{ vars.PRIVATE_ARTIFACT_DESTINATION }}
        run: |
          python scripts/classify_candidate.py --platform windows \
            --exe "dist/$APP_NAME.exe" \
            --authenticode-evidence build/authenticode-evidence.txt \
            --record build/candidate-record.txt
          cat build/candidate-record.txt

      - name: Recheck final digest
        id: digest
        if: steps.classify.outputs.allow_public_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^exe_sha256=//p' build/candidate-record.txt)
          actual=$(sha256sum "dist/$APP_NAME.exe" | cut -d' ' -f1)
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::final EXE digest changed after classification"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Labelled versioned release: v* tag push, usb-only, release APK, verified
      # signed EXE. make_latest=false keeps the README /releases/latest link on
      # the legacy build until retiring it is separately authorized.
      - name: Publish versioned release
        if: >-
          steps.classify.outputs.allow_public_release == 'true' &&
          steps.digest.outputs.ok == 'true' &&
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') &&
          github.ref == steps.classify.outputs.release_ref
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} (${{ steps.classify.outputs.label }})
          make_latest: false
          body: |
            CU Denver Equity Kiosk Manager for Windows.
            Class: **${{ steps.classify.outputs.label }}**.
            Digests and signer fingerprints are in `candidate-record.txt`.
          files: |
            dist/CU-Denver-Equity-Kiosk-Manager.exe
            build/apk-info.txt
            build/candidate-record.txt
          fail_on_unmatched_files: true
